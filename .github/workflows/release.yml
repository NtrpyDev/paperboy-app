# Builds a signed release APK when a version tag is pushed and attaches it to a GitHub Release.
# The tag must be "v" plus the versionName in app/build.gradle.kts, for example v0.1.0.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode the release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is empty or missing."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "PAPERBOY_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          PAPERBOY_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          PAPERBOY_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PAPERBOY_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check the tag against the version name and rename the APK
        id: apk
        run: |
          outputs=app/build/outputs/apk/release
          version="$(jq -r '.elements[0].versionName' "$outputs/output-metadata.json")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts. Tag this commit v$version."
            exit 1
          fi
          apk="$outputs/paperboy-$version.apk"
          mv "$outputs/app-release.apk" "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
